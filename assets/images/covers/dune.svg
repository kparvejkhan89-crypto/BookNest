<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="100%" stop-color="#3B1104" />
    </linearGradient>

    <!-- Spine Highlight -->
    <linearGradient id="spineShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="3%" stop-color="#000000" stop-opacity="0.35" />
      <stop offset="6%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </linearGradient>

    <!-- Outer Rim Shadow -->
    <filter id="bookShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Cover -->
  <rect width="400" height="580" rx="8" fill="url(#bgGrad)" />

  <!-- Subtle Border / Inset Frame -->
  <rect x="18" y="18" width="364" height="544" rx="4" fill="none" stroke="#FDBA74" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="24" y="24" width="352" height="532" rx="3" fill="none" stroke="#FDBA74" stroke-width="0.75" stroke-opacity="0.2" />

  <!-- Category Badge at Top -->
  <g transform="translate(200, 65)">
    <rect x="-65" y="-14" width="130" height="24" rx="12" fill="#FDBA74" fill-opacity="0.15" stroke="#FDBA74" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FDBA74" letter-spacing="1.5">FICTION</text>
  </g>

  <!-- Book Title -->
  <g transform="translate(0, 10)">
    <text x="200" y="155" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="2">D U N E</text>

  </g>

  <!-- Decorative Divider Under Title -->
  <g stroke="#FDBA74" stroke-width="1" opacity="0.6">
    <line x1="160" y1="210" x2="240" y2="210" />
    <circle cx="200" cy="210" r="3" fill="#FDBA74" />
  </g>

  <!-- Center Artwork / Motif -->
  
        <g fill="none" stroke="#FDBA74" stroke-width="2" opacity="0.6">
            <circle cx="200" cy="240" r="35" fill="#FDBA74" fill-opacity="0.2" />
            <path d="M60,340 Q130,270 200,310 T340,330 L340,380 L60,380 Z" fill="#FDBA74" fill-opacity="0.1" stroke="#FDBA74" />
            <path d="M60,360 Q150,310 250,340 T340,350" stroke="#FDBA74" stroke-width="2" />
        </g>
        

  <!-- Subtitle -->
  <text x="200" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-style="italic" fill="#D1D5DB" opacity="0.85" letter-spacing="0.5">
    The Epic Masterpiece
  </text>

  <!-- Author Name at Bottom -->
  <g transform="translate(200, 485)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="2">
      FRANK HERBERT
    </text>
    <text x="0" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#FDBA74" letter-spacing="1">
      BOOKNEST SPECIAL EDITION
    </text>
  </g>

  <!-- Book Spine 3D Lighting Layer -->
  <rect x="0" y="0" width="36" height="580" fill="url(#spineShade)" />
  <line x1="36" y1="0" x2="36" y2="580" stroke="#000000" stroke-opacity="0.25" stroke-width="1" />
</svg>