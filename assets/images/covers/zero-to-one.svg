<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Spine Highlight -->
    <linearGradient id="spineShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="3%" stop-color="#000000" stop-opacity="0.35" />
      <stop offset="6%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </linearGradient>

    <!-- Outer Rim Shadow -->
    <filter id="bookShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Cover -->
  <rect width="400" height="580" rx="8" fill="url(#bgGrad)" />

  <!-- Subtle Border / Inset Frame -->
  <rect x="18" y="18" width="364" height="544" rx="4" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="24" y="24" width="352" height="532" rx="3" fill="none" stroke="#93C5FD" stroke-width="0.75" stroke-opacity="0.2" />

  <!-- Category Badge at Top -->
  <g transform="translate(200, 65)">
    <rect x="-65" y="-14" width="130" height="24" rx="12" fill="#93C5FD" fill-opacity="0.15" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#93C5FD" letter-spacing="1.5">BUSINESS</text>
  </g>

  <!-- Book Title -->
  <g transform="translate(0, 10)">
    <text x="200" y="155" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="2">ZERO TO ONE</text>

  </g>

  <!-- Decorative Divider Under Title -->
  <g stroke="#93C5FD" stroke-width="1" opacity="0.6">
    <line x1="160" y1="210" x2="240" y2="210" />
    <circle cx="200" cy="210" r="3" fill="#93C5FD" />
  </g>

  <!-- Center Artwork / Motif -->
  
        <g fill="none" stroke="#93C5FD" stroke-width="2" opacity="0.55">
            <path d="M200,240 C215,265 220,295 218,325 L182,325 C180,295 185,265 200,240 Z" />
            <circle cx="200" cy="280" r="8" fill="#93C5FD" fill-opacity="0.5" />
            <path d="M182,310 L165,335 L182,330" />
            <path d="M218,310 L235,335 L218,330" />
            <path d="M190,335 L200,355 L210,335" stroke-width="1.5" />
        </g>
        

  <!-- Subtitle -->
  <text x="200" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-style="italic" fill="#D1D5DB" opacity="0.85" letter-spacing="0.5">
    Notes on Startups, or How to Build the Future
  </text>

  <!-- Author Name at Bottom -->
  <g transform="translate(200, 485)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="2">
      PETER THIEL
    </text>
    <text x="0" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93C5FD" letter-spacing="1">
      BOOKNEST SPECIAL EDITION
    </text>
  </g>

  <!-- Book Spine 3D Lighting Layer -->
  <rect x="0" y="0" width="36" height="580" fill="url(#spineShade)" />
  <line x1="36" y1="0" x2="36" y2="580" stroke="#000000" stroke-opacity="0.25" stroke-width="1" />
</svg>